<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-label="ConfigLens">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="230" rx="14" fill="url(#bg)"/>

  <!-- magnifier over a config brace -->
  <g transform="translate(95,115)">
    <text x="-38" y="16" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" font-size="64" fill="#3d4a5c" text-anchor="middle">{&#160;}</text>
    <circle cx="8" cy="-6" r="34" fill="none" stroke="url(#lens)" stroke-width="7"/>
    <line x1="32" y1="20" x2="58" y2="46" stroke="url(#lens)" stroke-width="9" stroke-linecap="round"/>
    <text x="8" y="4" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" font-size="26" fill="#2dd4bf" text-anchor="middle">:</text>
  </g>

  <text x="190" y="112" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="700" fill="#e6edf3">Config<tspan fill="#2dd4bf">Lens</tspan></text>
  <text x="192" y="151" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#9db1c5">The contract between your config and your code — checked.</text>

  <!-- rule chips -->
  <g font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" font-size="15" text-anchor="middle">
    <rect x="915" y="62" width="200" height="30" rx="15" fill="#20293a" stroke="#cf222e" stroke-opacity=".55"/>
    <text x="1015" y="82" fill="#ff7b72">CL001 missing key</text>
    <rect x="915" y="100" width="200" height="30" rx="15" fill="#20293a" stroke="#9a6700" stroke-opacity=".55"/>
    <text x="1015" y="120" fill="#e3b341">CL002 env drift</text>
    <rect x="915" y="138" width="200" height="30" rx="15" fill="#20293a" stroke="#2dd4bf" stroke-opacity=".55"/>
    <text x="1015" y="158" fill="#2dd4bf">score 79/100</text>
  </g>
</svg>
